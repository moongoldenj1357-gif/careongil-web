<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>케어온길 지역 리포트</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#f7f4ee;--card:#fff;--ink:#1f2a24;--sub:#5d6a62;--line:#e4ded2;--main:#2f6b4f;--main-soft:#e6f0ea;--warm:#c8762f;--warm-soft:#fbefe2;--grey:#c9c3b6}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.6;word-break:keep-all}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.bar{position:sticky;top:0;z-index:5;background:#24473a;color:#fff;padding:10px 0}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar a,.bar button{color:#fff;font:inherit;font-size:.9rem}
.bar button{background:#f5a35c;border:0;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer;color:#1f2a24}
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;margin:18px 0 40px}
h1{font-size:1.5rem;margin:0 0 4px;line-height:1.35}
h2{font-size:1.2rem;margin:34px 0 10px;padding-top:14px;border-top:2px solid var(--main-soft)}
h3{font-size:1rem;margin:20px 0 6px}
.meta{color:var(--sub);font-size:.9rem}
.lead{background:var(--main-soft);border-radius:12px;padding:14px 16px;margin:16px 0}
.lead li{margin:6px 0}.doc ul{padding-left:20px}.doc li{margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.doc{padding:20px 14px}}
.kpi{background:#f6f3ec;border-radius:10px;padding:10px 12px}
.kpi small{color:var(--sub);display:block;font-size:.8rem}
.kpi b{font-size:1.25rem}
.kpi span{display:block;font-size:.78rem;color:var(--sub)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:.8rem;background:#faf8f3}
td.l,th.l{text-align:left;white-space:normal}
tr.me td{background:#fff7e0;font-weight:700}
.note{background:var(--warm-soft);border-radius:10px;padding:10px 12px;font-size:.86rem;margin:12px 0}
.muted{color:var(--sub)}
.small{font-size:.82rem}
.neg{color:#b4472f}
.pos{color:var(--main)}
.chart{margin:8px 0}
.yb{display:grid;grid-template-columns:52px 1fr 40px;gap:6px;align-items:center;font-size:.85rem;margin:3px 0}
.yb i{display:block;height:12px;border-radius:5px;background:var(--grey)}
.yb i.ac{background:var(--main)}
.tag{display:inline-block;background:var(--warm);color:#fff;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700;margin-left:6px;vertical-align:middle}
#msg{padding:60px 0;text-align:center}
.ask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px;margin:0 0 40px}
.ask h2{border:0;margin:0 0 6px;padding:0}
.ask details{border-bottom:1px solid var(--line);padding:10px 0}.ask summary{cursor:pointer;font-weight:600}
.ask details p{margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:.85rem;cursor:pointer}
.chatlog{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.bub{padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:.92rem;max-width:92%}
.bub.me{align-self:flex-end;background:var(--main);color:#fff}.bub.ai{align-self:flex-start;background:#f3efe6}
.askrow{display:flex;gap:8px}.askrow textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;min-height:48px;resize:vertical}
.askrow button,.more{background:var(--main);color:#fff;border:0;border-radius:10px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}
.more{background:none;color:var(--main);padding:2px 0;font-size:.85rem;font-weight:600}
.wait{display:inline-flex;align-items:center;gap:8px}.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--main);animation:blink 1.2s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.asktip{background:var(--main-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:12px 0}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:12px}
  .bar,.noprint{display:none!important}
  .doc{border:0;padding:0;margin:0}
  h2{break-after:avoid}
  table,.kpis,.chart,.lead{break-inside:avoid}
  .tbl{overflow:visible}
}
</style>
</head>
<body>
<div class="bar noprint"><div class="wrap"><a href="/biz">케어온길 비즈</a><span><a id="back" href="#">신청 확인</a> &nbsp; <button onclick="print()">PDF로 저장 · 인쇄</button></span></div></div>
<div class="wrap"><div id="msg">보고서를 불러오는 중입니다…</div><article class="doc" id="doc" hidden></article>
<section class="ask noprint" id="ask" hidden></section></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = (x) => (x == null ? "–" : Number(x).toLocaleString("ko-KR"));
const p = (x) => (x == null ? "–" : x + "%");
const man = (w) => (w == null ? "–" : (Math.round(w / 10000)).toLocaleString("ko-KR") + "만 원");
const eok = (w) => (Math.abs(w) >= 1e8 ? (w / 1e8).toFixed(1) + "억 원" : man(w));
const sgn = (w) => `<span class="${w < 0 ? "neg" : "pos"}">${w < 0 ? "−" : "+"}${man(Math.abs(w))}</span>`;
const t = new URLSearchParams(location.search).get("t") || "";
$("#back").href = "/order?t=" + encodeURIComponent(t);

function kpi(label, val, sub) { return `<div class="kpi"><small>${label}</small><b>${val}</b>${sub ? `<span>${sub}</span>` : ""}</div>`; }
function table(head, rows, cls = "") { return `<div class="tbl"><table class="${cls}"><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.join("")}</table></div>`; }

// 개원 후 누적 손익 꺾은선
function rampSvg(series, title) {
  const W = 760, H = 300, L = 70, R = 740, T = 40, B = 250;
  const all = series.flatMap((s) => s.pts), lo0 = Math.min(0, ...all), hi0 = Math.max(0, ...all), pad = (hi0 - lo0) * 0.12 || 1, lo = lo0 - pad, hi = hi0 + pad * 0.3;
  const span = hi - lo, x = (m) => L + (m - 1) / 23 * (R - L), y = (v) => T + (hi - v) / span * (B - T);
  const step = Math.pow(10, Math.floor(Math.log10(span / 4))), nice = [1, 2, 5, 10].map((k) => k * step).find((k) => span / k <= 6);
  let g = "";
  for (let v = Math.ceil(lo / nice) * nice; v <= hi; v += nice) g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "#8a8a8a" : "#e4ded2"}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5d6a62">${v === 0 ? "0" : (v / 1e8).toFixed(1) + "억"}</text>`;
  [1, 6, 12, 18, 24].forEach((m) => (g += `<text x="${x(m)}" y="${B + 18}" text-anchor="middle" font-size="11" fill="#5d6a62">${m}개월</text>`));
  const col = ["#2f6b4f", "#b3ad9f"];
  series.forEach((s, i) => {
    g += `<path d="${s.pts.map((v, k) => `${k ? "L" : "M"}${x(k + 1)},${y(v)}`).join("")}" fill="none" stroke="${col[i]}" stroke-width="${i ? 2.5 : 3}"/>`;
    g += `<circle cx="${x(s.minM)}" cy="${y(s.min)}" r="4" fill="${col[i]}"/><text x="${x(s.minM) + (i ? 0 : 8)}" y="${y(s.min) + (i ? -10 : 20)}" text-anchor="${i ? "middle" : "start"}" font-size="11" font-weight="700" fill="${col[i]}">최저 ${s.min < 0 ? "−" : ""}${eok(Math.abs(s.min))} (${s.minM}개월)</text>`;
  });
  g += `<rect x="${L}" y="12" width="14" height="4" fill="${col[0]}"/><text x="${L + 20}" y="18" font-size="11">매달 ${series[0].step}%p씩 참</text><rect x="${L + 160}" y="12" width="14" height="4" fill="${col[1]}"/><text x="${L + 180}" y="18" font-size="11">매달 ${series[1].step}%p씩 참</text>`;
  return `<div class="chart"><b style="font-size:.95rem">${esc(title)}</b><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}
function rampText(series) {
  const [s, f] = series;
  const pb = (x) => (x.payback ? `${x.payback}개월째에 누적 흑자로 돌아섭니다` : "24개월 안에는 누적 적자를 회수하지 못합니다");
  return `<p>개원 첫 달 이용률 30%에서 시작해 <b>매달 ${s.step}%p씩</b> 차면 ${s.minM}개월째에 누적 적자가 가장 크고(<b>약 ${eok(Math.abs(Math.min(0, s.min)))}</b>), ${pb(s)}. 매달 ${f.step}%p씩 빠르게 차면 최저점은 약 ${eok(Math.abs(Math.min(0, f.min)))}이고 ${pb(f)}. 이 최저점이 개원 후 버텨야 할 <b>운영자금</b>입니다.</p>`;
}
function plTable(pl) {
  return table(["이용률", "월 매출", "월 고정비", "월 손익"], pl.rows.map((r) => `<tr><td>${r.occ}%</td><td>${man(r.rev)}</td><td>${man(pl.fixed)}</td><td>${sgn(r.profit)}</td></tr>`));
}
function hist(h) { return h && h.length ? esc(h.join("→")) : "–"; }

// ---------- 해설 문장 도우미 ----------
const pp = (d) => `${d >= 0 ? "" : "−"}${Math.abs(Math.round(d * 10) / 10)}%p`;
const r1 = (x) => Math.round(x * 10) / 10;
function cmpWord(v, base, tol = 0.1) { if (v == null || base == null) return ""; const r = v / base; return r >= 1 + tol ? "높습니다" : r <= 1 - tol ? "낮습니다" : "비슷합니다"; }
function category(S, D) {
  if (S.occ == null || D.occ == null) return "mid-mid";
  const d = S.occ - D.occ, r = S.capPer1k80 && D.capPer1k80 ? S.capPer1k80 / D.capPer1k80 : 1;
  const cap = r <= 0.85 ? "low" : r >= 1.15 ? "high" : "mid";
  const use = d >= 3 || (d > -3 && S.wait > 0 && S.occ >= D.occ) ? "high" : d <= -3 ? "low" : "mid";
  return `${cap}-${use}`;
}
function li(a) { return `<ul>${a.filter(Boolean).map((x) => `<li>${x}</li>`).join("")}</ul>`; }

function render(R) {
  const S = R.sgg, D = R.sido, F = R.facts || {}, place = `${R.region.sido_nm} ${R.region.sgg_nm}`, sg = R.region.sgg_nm, full = R.product !== "basic";
  const who = R.kind === "home" ? "입소자" : "이용자", KN = R.kind_nm;
  const cat = category(S, D), [capL, useL] = cat.split("-");
  const ratio = S.capPer1k80 && D.capPer1k80 ? r1(S.capPer1k80 / D.capPer1k80) : null;
  const gA = R.byGrade.find((g) => g.label === "A등급"), gNone = R.byGrade.find((g) => g.label.startsWith("평가 없음"));
  const sizes = R.bySize.filter((x) => x.label !== "10인 미만" && x.occ != null);
  const big = sizes[sizes.length - 1], small = sizes[0];
  const sizeGap = big && small && big !== small ? big.occ - small.occ : 0;
  const pl50 = R.plStd.rows[1], be = pl50.be, newO = R.newOcc?.n ? R.newOcc.occ : null;
  const at = (pl, o) => pl.rows.find((x) => x.occ === o) || pl.rows[0];
  let secN = 0; const H2 = (t) => `<h2>${++secN}. ${t}</h2>`;
  document.title = `${R.product_nm} — ${place} · ${KN} | 케어온길`;

  // ===== 머리말 + 한 줄 결론 =====
  const one = {
    "high-high": ratio >= 1.5 ? `${sg} ${KN} 시장은 자리가 이미 많지만 다른 지역 수요까지 끌어오는 곳입니다.` : `${sg} ${KN} 시장은 고령 인구에 비해 자리가 많은 편이지만 잘 채워지는 곳입니다.`,
    "high-mid": `${sg} ${KN} 시장은 고령 인구에 비해 자리가 많은 편이고, 이용률은 시·도 평균 수준입니다.`,
    "high-low": `${sg} ${KN} 시장은 자리가 많고 남는 자리도 많아 경쟁이 치열한 곳입니다.`,
    "mid-high": `${sg} ${KN} 시장은 자리 수는 시·도 평균 수준이고, 잘 채워지는 곳입니다.`,
    "mid-mid": `${sg} ${KN} 시장은 자리 수와 이용률 모두 시·도 평균 수준입니다.`,
    "mid-low": `${sg} ${KN} 시장은 자리 수는 평균 수준이지만 남는 자리가 많은 편입니다.`,
    "low-high": `${sg} ${KN} 시장은 고령 인구에 비해 자리가 적고 잘 채워져, 새 기관이 들어설 여지가 있는 곳으로 보입니다.`,
    "low-mid": `${sg} ${KN} 시장은 고령 인구에 비해 자리가 적은 편이고, 이용률은 평균 수준입니다.`,
    "low-low": `${sg} ${KN} 시장은 자리도 적고 이용률도 낮아, 이용 수요 자체가 적거나 이웃 지역으로 빠져나가는 곳으로 보입니다.`,
  }[cat];
  const slow = newO != null && S.occ != null && S.occ - newO >= 5;
  const wq = gA?.wait && S.wait && gA.wait / S.wait >= 0.4 ? "대기는 평가가 좋은 기관에 몰려 있습니다" : F.waitTop && S.wait >= 10 && F.waitTop.w2 / S.wait >= 0.5 ? "대기는 몇몇 기관에 몰려 있습니다" : null;
  const tail = slow && wq ? [`새로 들어가는 기관은 채우는 데 시간이 걸리고, ${wq}`] : slow ? ["새로 들어가는 기관은 채우는 데 시간이 걸립니다"] : wq ? [wq] : [];
  let h = `<p class="meta">케어온길 지역 리포트 · ${esc(R.product_nm)}<span class="tag">신청번호 ${esc(R.no)}</span></p>
    <h1>${esc(place)} · ${esc(KN)}</h1>
    <p class="meta">발행 ${new Date(R.made_at).toLocaleDateString("ko-KR")} · 기관 자료 국민건강보험공단 공개 정보 · 인구 행정안전부 주민등록인구(${esc(R.popYm || "")})</p>
    <p style="font-size:1.05rem;margin:14px 0 0"><b>${esc(one)}</b>${tail.length ? ` ${esc(tail[0])}.` : ""}</p>`;

  // ===== 핵심 요약 =====
  const key = [];
  if (S.capPer1k80 != null && D.capPer1k80) {
    const lab = capL === "high" ? "공급이 많습니다." : capL === "low" ? "공급이 적습니다." : "공급은 평균 수준입니다.";
    key.push(`<b>${lab}</b> 80세 이상 1,000명당 정원이 ${S.capPer1k80}명으로 ${esc(R.region.sido_nm)} 평균(${D.capPer1k80}명)${capL === "mid" ? "과 비슷하며" : `의 ${ratio}배이며`}${F.densRank?.rank ? `, ${esc(R.region.sido_nm)} ${F.densRank.of}개 시·군·구 중 ${F.densRank.rank}번째로 높습니다` : ""}.`);
  }
  if (S.occ != null) {
    const lab = useL === "high" ? (capL === "high" ? "그래도 채워집니다." : "잘 채워집니다.") : useL === "low" ? "남는 자리가 많습니다." : "이용률은 평균 수준입니다.";
    key.push(`<b>${lab}</b> 이용률 ${S.occ}%(${esc(R.region.sido_nm)} ${D.occ}%), 대기 ${n(S.wait)}명입니다.${cat === "high-high" && ratio >= 1.5 ? " 이 지역 어르신만으로는 채울 수 없는 규모라, 인근 지역의 수요가 들어오는 것으로 보입니다." : ""}`);
  }
  const conc = [];
  if (sizeGap >= 5) conc.push(`${big.label} 이용률 ${big.occ}%, ${small.label} ${small.occ}%`);
  if (gA?.wait && S.wait) conc.push(`A등급 기관 ${gA.n}곳이 대기 ${n(S.wait)}명 중 ${n(gA.wait)}명을 차지합니다`);
  if (conc.length) key.push(`<b>${sizeGap >= 5 && gA?.wait / S.wait >= 0.4 ? "큰 기관·좋은 평가에 수요가 몰립니다." : sizeGap >= 5 ? "큰 기관일수록 잘 채워집니다." : "대기는 평가가 좋은 기관에 몰립니다."}</b> ${conc.join(". ")}.`);
  if (F.entry && newO != null) key.push(`<b>${F.entry.avg >= 3 ? "진입은 꾸준하고" : "새 진입은 많지 않고"} ${S.occ - newO >= 5 ? "초기가 어렵습니다." : "신규 기관도 비교적 잘 채워집니다."}</b> ${F.entry.from}년 이후 해마다 ${F.entry.min === F.entry.max ? F.entry.min : `${F.entry.min}~${F.entry.max}`}곳이 새로 지정됐고, 아직 평가를 받지 않은 신규 기관 ${n(R.newOcc.n)}곳의 이용률은 ${newO}%입니다.`);
  if (R.custom) key.push(`<b>의뢰 조건의 손익분기 이용률은 ${R.custom.pl.be}%입니다.</b> 이 지역 평균 이용률(${p(S.occ)})${newO != null ? `, 신규 기관 평균(${newO}%)` : ""}과 비교해 보세요.`);
  h += `<div class="lead"><b>핵심 요약</b>${li(key)}</div>`;
  h += `<p class="asktip noprint">💬 숫자의 뜻이나 해석이 궁금하시면 <a href="#ask">맨 아래 '보고서 풀이 · AI에게 묻기'</a>에서 무료로 물어보실 수 있습니다. 이 보고서의 숫자를 바탕으로 답해 드립니다.</p>`;

  // ===== 1. 수요 =====
  h += H2("수요: 고령 인구");
  const peers = (F.peers || []).map((cd) => R.sggs.find((x) => x.cd === cd)).filter(Boolean);
  if (S.pop) {
    const pTxt = peers.length ? ` 아래 표에 비교 지역(${peers.slice(0, 3).map((x) => esc(x.nm)).join(", ")})을 함께 실었습니다.` : "";
    const aw = cmpWord(S.pop.aged, D.pop?.aged, 0.05);
    h += `<p>${esc(sg)}의 80세 이상 인구는 <b>${n(S.pop.p80)}명</b>, 65세 이상은 ${n(S.pop.p65)}명입니다. 고령화율은 ${S.pop.aged}%로 ${esc(R.region.sido_nm)} 평균(${D.pop?.aged ?? "–"}%)${aw === "비슷합니다" ? "과 비슷합니다" : "보다 " + aw}.${pTxt}</p>`;
    const me = R.sggs.find((x) => x.me);

  h += H2("운영 비교");

    O.room && R.kind !== "daycare" ? `<tr><td class="l">상급침실 사용료 (하루)</td><td class="l">중간값 ${n(O.room.med)}원</td><td class="l">신고 ${n(O.room.n)}곳</td></tr>` : "",
